name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands to Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            echo "🚀 Starting automated deployment on Hostinger..."
            test -d "$HOME/kfs-repo" || git clone https://github.com/elswalhi/kfs-runners-platform.git "$HOME/kfs-repo"
            cd "$HOME/kfs-repo"
            git fetch origin main
            git reset --hard origin/main
            bash deploy/hostinger/deploy.sh
